[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "match-matrix-resume-matcher"
version = "0.1.0"
description = "Structured data extraction and deterministic AI resume matching dashboard"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.42,<2",
    "pydantic>=2.8,<3",
    "openai>=1.55,<3",
    "groq>=0.11,<2",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "odfpy>=1.4,<2",
    "beautifulsoup4>=4.12,<5",
    "Pillow>=10,<14",
    "pytesseract>=0.3.13,<1",
    "reportlab>=4.2,<6",
]

[tool.setuptools.packages.find]
include = ["resume_matcher*"]
